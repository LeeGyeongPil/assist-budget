# Tests need no Home Assistant, no token and no network: they run on the committed
# fixtures (written by a real Home Assistant 2026.11.3) and an in-process fake server.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday: catch dependency or runtime changes
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run --extra tekken pytest -q tests/test_tokenize.py
      - run: uv run assist-budget --lang en demo --ctx 4096
